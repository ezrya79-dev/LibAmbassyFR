# Reverse proxy pour LibAmbassyFR — alfpr.joefr.cloud
# À déposer dans /etc/nginx/sites-available/ puis lier dans sites-enabled/.
# ATTENTION : le bloc 443 référence un certificat Let's Encrypt qui doit déjà
# exister. `deploy/install-vps.sh` s'en charge (conf HTTP seule → certbot →
# conf complète). Ne pas activer cette conf avant d'avoir obtenu le certificat.

upstream libambassyfr {
    server 127.0.0.1:7100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name alfpr.joefr.cloud;

    # Laisse passer les challenges Let's Encrypt, redirige tout le reste en HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alfpr.joefr.cloud;

    ssl_certificate     /etc/letsencrypt/live/alfpr.joefr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alfpr.joefr.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Dépôt de documents usagers : jusqu'à 500 Mo (cf. MAX_UPLOAD_MB).
    client_max_body_size 500m;
    client_body_timeout 600s;
    # Streaming direct vers Next.js : évite de bufferiser 500 Mo sur disque.
    proxy_request_buffering off;

    # En-têtes de sécurité (le portail sert des données d'état civil).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Pas de X-Frame-Options DENY : le wizard de RDV embarque Calendly en iframe.
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets buildés : hachés par Next.js, donc immuables.
    location /_next/static/ {
        proxy_pass http://libambassyfr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://libambassyfr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_cache_bypass $http_upgrade;
    }
}
